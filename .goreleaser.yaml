# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# LibreSeal CLI release configuration, run by .github/workflows/release.yml on
# vX.Y.Z tags. Publishing to package managers is not configured; releases only
# attach binaries to a draft release of Dos2Locos/libreseal-cli.
version: 2

project_name: libreseal

before:
  hooks:
    - sh -c "cd src && go mod download"
    - sh -c "cd src && go vet ./..."

builds:
  - id: libreseal
    dir: src
    binary: libreseal
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/phasehq/cli/pkg/version.Version={{ .Version }}
    targets:
      - linux_amd64
      - linux_arm64
      - linux_riscv64
      - darwin_amd64
      - darwin_arm64
      - freebsd_amd64
      - windows_amd64
      - windows_arm64

archives:
  - id: binaries
    ids:
      - libreseal
    formats: [binary]
    name_template: "libreseal_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless cosign signature of checksums.txt with the release workflow's OIDC
# identity; users verify it with `cosign verify-blob --bundle` (see README).
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

release:
  github:
    owner: Dos2Locos
    name: libreseal-cli
  draft: true
  # GPL-3.0: ship the license next to the binaries (GitHub attaches the
  # tag's source code to every release).
  extra_files:
    - glob: ./LICENSE
  prerelease: auto
  name_template: "v{{ .Version }}"
