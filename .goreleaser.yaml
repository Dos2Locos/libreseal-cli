# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# LibreSeal CLI release configuration. Publishing to package managers is not
# configured yet; releases only attach binaries to Dos2Locos/libreseal-cli.
version: 2

project_name: libreseal

before:
  hooks:
    - sh -c "cd src && go mod download"
    - sh -c "cd src && go vet ./..."

builds:
  - id: libreseal
    dir: src
    binary: libreseal
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/phasehq/cli/pkg/version.Version={{ .Version }}
    targets:
      - linux_amd64
      - linux_arm64
      - linux_riscv64
      - darwin_amd64
      - darwin_arm64
      - freebsd_amd64
      - windows_amd64
      - windows_arm64

archives:
  - id: binaries
    ids:
      - libreseal
    formats: [binary]
    name_template: "libreseal_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  github:
    owner: Dos2Locos
    name: libreseal-cli
  draft: true
  prerelease: auto
  name_template: "v{{ .Version }}"
