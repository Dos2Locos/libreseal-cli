name: Release

# Publishes a LibreSeal CLI release when a maintainer pushes a vX.Y.Z tag (or
# vX.Y.Z-rc.N) that points at a commit on main. Runs the tests, then
# GoReleaser builds the binaries, signs checksums.txt with cosign (keyless,
# this workflow's OIDC identity) and attaches everything to a draft release.
# A maintainer publishes the draft.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag format and commit on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "::error::tag $TAG is not vX.Y.Z or vX.Y.Z-rc.N"; exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $TAG points at $GITHUB_SHA, which is not on main"; exit 1
          fi

  test:
    needs: verify
    uses: ./.github/workflows/test.yml

  goreleaser:
    needs: [verify, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache-dependency-path: src/go.sum
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Release exactly the pushed tag: when several tags point at the same
          # commit (e.g. v0.1.0-rc.1 and v0.1.0), GoReleaser would otherwise
          # pick one of them by itself.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
