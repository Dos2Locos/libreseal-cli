name: "Test & Build"

# Tests and builds only; LibreSeal does not publish CLI packages yet.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    uses: ./.github/workflows/test.yml

  install-from-source:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache-dependency-path: src/go.sum
      - name: Install from source
        run: PREFIX="$HOME/.local" ./scripts/install-from-source.sh
      - name: Smoke test
        run: |
          "$HOME/.local/bin/libreseal" --version
          "$HOME/.local/bin/libreseal" --help | grep -q LibreSeal
